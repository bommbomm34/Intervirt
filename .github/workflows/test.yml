name: Test All
on:
  push:
    paths:
      - '**.kt'
      - '**.rs'
      - 'gradle/libs.versions.toml'
      - '**.kts'
      - '**.xml'
      - '**.jar'
      - '**.properties'
      - 'incus/intervirt-os.yaml'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
      - name: Test Core
        run: ./gradlew :core:allTests
      - name: Test UI
        run: ./gradlew :ui:allTests
      - name: Test Secret
        run: ./gradlew :secret:test
      - name: Test Logging
        run: ./gradlew :logging:allTests